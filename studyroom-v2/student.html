<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더몰입 스터디룸 예약</title><style>body{font:16px system-ui,'Malgun Gothic';background:#f4f6f9;color:#17243a;margin:0;padding:18px}main{max-width:560px;margin:auto}section{background:white;padding:18px;border-radius:15px;margin:12px 0;box-shadow:0 3px 14px #0001}h1{font-size:24px}label{display:block;margin:10px 0 5px}input,button{font:inherit;padding:12px;border:1px solid #ccd3dc;border-radius:9px;width:100%;box-sizing:border-box}button{background:#17243a;color:white;border:0;margin-top:10px;cursor:pointer}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slot{padding:9px;font-size:13px;background:#edf1f6;color:#17243a}.slot.busy{background:#fce5e5;color:#a33}.slot.selected{background:#17243a;color:white}.small{font-size:12px;color:#667}.result{white-space:pre-wrap;font-size:14px}</style><main><h1>더몰입 스터디룸 예약</h1><p class="small">회원 전용 · 1시간 단위 · 08:00~24:00</p><section><h3>회원 등록 (최초 1회)</h3><label>학생 이름</label><input id="name"><label>좌석 번호</label><input id="seat"><label>개인 PIN (4~8자리 숫자)</label><input id="pin" type="password" inputmode="numeric"><button onclick="register()">회원 등록</button></section><section><h3>예약하기</h3><label>학생 이름</label><input id="bn"><label>좌석 번호</label><input id="bs"><label>PIN</label><input id="bp" type="password" inputmode="numeric"><label>예약 날짜</label><input id="date" type="date"><button onclick="loadSlots()">예약 가능 시간 조회</button><div id="slots" class="slots"></div><p id="chosen"></p><label>종료 시간</label><select id="end"><option>1시간</option><option>2시간</option><option>3시간</option><option>4시간</option></select><button onclick="book()">예약 확정</button><div id="msg" class="result"></div></section><section><h3>내 예약 확인 / 취소</h3><button onclick="mine()">내 예약 조회</button><div id="mine" class="result"></div></section><p class="small">예약 관련 문의는 카운터로 연락해 주세요.</p></main><script>
const API='https://YOUR-WORKER.workers.dev';let busy=[],picked=null;
async function call(action,data={},method='POST'){let r=await fetch(API+'?action='+action,{method,headers:method==='POST'?{'Content-Type':'application/json'}:{},body:method==='POST'?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
function creds(prefix=''){return {name:document.getElementById(prefix+'n').value.trim(),seat:document.getElementById(prefix+'s').value.trim(),pin:document.getElementById(prefix+'p').value}}
async function register(){try{await call('register',{name:name.value.trim(),seat:seat.value.trim(),pin:pin.value});msg.textContent='회원 등록 완료';}catch(e){msg.textContent=e.message}}
async function loadSlots(){try{let d=date.value;if(!d)throw Error('날짜를 선택하세요');let x=await call('availability',{date:d},'GET');busy=x.busy;draw();}catch(e){msg.textContent=e.message}}
function draw(){slots.innerHTML='';for(let h=8;h<24;h++){let t=String(h).padStart(2,'0')+':00',b=busy.some(x=>t>=x.start_at&&t<x.end_at);let q=document.createElement('button');q.textContent=t;q.className='slot '+(b?'busy':'')+(picked===t?' selected':'');q.disabled=b;q.onclick=()=>{picked=t;chosen.textContent='시작: '+t;draw()};slots.append(q)}}
async function book(){try{if(!picked)throw Error('시작 시간을 선택하세요');let n=Number(end.value[0]),h=Number(picked.slice(0,2))+n,e=h===24?'24:00':String(h).padStart(2,'0')+':00';await call('book',{name:bn.value,seat:bs.value,pin:bp.value,date:date.value,start:picked,end:e});msg.textContent='예약 완료';picked=null;loadSlots()}catch(e){msg.textContent=e.message}}
async function mine(){try{let x=await call('myBookings',{name:bn.value,seat:bs.value,pin:bp.value});mineBox.innerHTML='';x.bookings.forEach(b=>{let p=document.createElement('p');p.textContent=b.date+' '+b.start_at+'~'+b.end_at+' ';let q=document.createElement('button');q.textContent='취소';q.onclick=async()=>{try{await call('cancel',{name:bn.value,seat:bs.value,pin:bp.value,id:b.id});mine()}catch(e){alert(e.message)}};p.append(q);mineBox.append(p)})}catch(e){mineBox.textContent=e.message}}
document.getElementById('date').value=new Date().toISOString().slice(0,10);
</script></html>

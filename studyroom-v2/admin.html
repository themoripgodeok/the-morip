<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스터디룸 관리자</title><style>body{font:16px system-ui,'Malgun Gothic';background:#f3f5f8;margin:0;padding:20px;color:#17243a}main{max-width:850px;margin:auto}section{background:white;padding:18px;border-radius:14px;margin:12px 0}input,button{font:inherit;padding:10px;border:1px solid #ccd3dc;border-radius:8px;margin:4px}button{cursor:pointer;background:#17243a;color:white}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}</style><main><h1>스터디룸 예약 관리자</h1><section><input id="key" type="password" placeholder="관리자 키"><input id="date" type="date"><button onclick="load()">예약 조회</button></section><section><div id="out">날짜를 선택하고 조회하세요.</div></section></main><script>const API='https://YOUR-WORKER.workers.dev';async function load(){try{let r=await fetch(API+'?action=adminList',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey:key.value,date:date.value})});let j=await r.json();if(!r.ok)throw Error(j.error);out.innerHTML='<table><thead><tr><th>시간</th><th>이름</th><th>좌석</th><th>상태</th><th></th></tr></thead><tbody>'+j.bookings.map(b=>'<tr><td>'+b.start_at+'–'+b.end_at+'</td><td>'+esc(b.name)+'</td><td>'+esc(b.seat)+'</td><td>'+b.status+'</td><td>'+(b.status==='active'?'<button onclick="cancel(\''+b.id+'\')">취소</button>':'')+'</td></tr>').join('')+'</tbody></table>'}catch(e){out.textContent=e.message}}async function cancel(id){if(!confirm('예약을 취소할까요?'))return;let r=await fetch(API+'?action=adminCancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey:key.value,id})});let j=await r.json();if(!r.ok)alert(j.error);else load()}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}date.value=new Date().toISOString().slice(0,10)</script></html>
